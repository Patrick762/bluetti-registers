name: Build json

on:
    push:
        branches: [ "main" ]
        paths:
        - 'csv/**'
        - '*.py'
        - '.github/workflows/**'
        tags:
            - "*"

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
        -   uses: actions/checkout@v4
        -   name: Set up Python 3.10
            uses: actions/setup-python@v3
            with:
                python-version: "3.10"
        -   name: Install dependencies
            run: |
                python -m pip install --upgrade pip
                pip install flake8 pytest
                if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        -   name: Run generator
            run: python src/generate.py
        -   name: Upload protocols artifact
            uses: actions/upload-artifact@v7
            with:
                name: protocols.json
                path: ./out/protocols.json
        -   name: Upload enums artifact
            uses: actions/upload-artifact@v7
            with:
                name: enums.json
                path: ./out/enums.json
        -   name: Upload translations artifact
            uses: actions/upload-artifact@v7
            with:
                name: translations.json
                path: ./out/translations.json
        -   name: Upload devices artifact
            uses: actions/upload-artifact@v7
            with:
                name: devices.json
                path: ./out/devices.json
        -   name: Release
            uses: softprops/action-gh-release@v3
            if: github.ref_type == 'tag'
            with:
                files: |
                    ./out/protocols.json
                    ./out/enums.json
                    ./out/translations.json
                    ./out/devices.json
