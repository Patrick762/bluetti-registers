name: Python build json

on:
    push:
        branches: [ "main" ]
        paths:
        - 'bluetooth/**'
        - 'modbus-tcp/**'
        - '*.py'
        - '.github/workflows/**'
        tags:
            - "*"

jobs:
    validate-devices:
        runs-on: ubuntu-latest
        steps:
        -   uses: actions/checkout@v4
        -   name: Set up Python 3.10
            uses: actions/setup-python@v3
            with:
                python-version: "3.10"
        -   name: Install dependencies
            run: |
                python -m pip install --upgrade pip
                if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        -   name: Run validation
            run: python validate-devices.py

    validate-translations:
        runs-on: ubuntu-latest
        steps:
        -   uses: actions/checkout@v4
        -   name: Set up Python 3.10
            uses: actions/setup-python@v3
            with:
                python-version: "3.10"
        -   name: Install dependencies
            run: |
                python -m pip install --upgrade pip
                if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        -   name: Run validation
            run: python validate-translations.py

    build:
        runs-on: ubuntu-latest
        needs: [validate-devices, validate-translations]
        steps:
        -   uses: actions/checkout@v4
        -   name: Set up Python 3.10
            uses: actions/setup-python@v3
            with:
                python-version: "3.10"
        -   name: Install dependencies
            run: |
                python -m pip install --upgrade pip
                pip install flake8 pytest
                if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        -   name: Run generator
            run: python generate.py
        -   name: Upload bluetooth artifact
            uses: actions/upload-artifact@v7
            with:
                name: bluetooth.json
                path: ./out/bluetooth.json
        -   name: Upload modbus-tcp artifact
            uses: actions/upload-artifact@v7
            with:
                name: modbus-tcp.json
                path: ./out/modbus-tcp.json
        -   name: Release
            uses: softprops/action-gh-release@v3
            if: github.ref_type == 'tag'
            with:
                files: |
                    ./out/bluetooth.json
                    ./out/modbus-tcp.json
                    ./translations/en.json
                    ./translations/de.json
