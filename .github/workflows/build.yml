name: Build json

on:
    push:
        branches: [ "main" ]
        paths:
        - 'csv/**'
        - '*.py'
        - '.github/workflows/**'
        tags:
            - "*"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
        -   uses: actions/checkout@v4
        -   name: Set up Python 3.10
            uses: actions/setup-python@v3
            with:
                python-version: "3.10"
        -   name: Install dependencies
            run: |
                python -m pip install --upgrade pip
                pip install flake8 pytest
                if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        -   name: Run generator
            run: python src/generate.py
        -   name: Upload protocols artifact
            uses: actions/upload-artifact@v7
            with:
                name: protocols.json
                path: ./out/protocols.json
        -   name: Upload enums artifact
            uses: actions/upload-artifact@v7
            with:
                name: enums.json
                path: ./out/enums.json
        -   name: Upload translations artifact
            uses: actions/upload-artifact@v7
            with:
                name: translations.json
                path: ./out/translations.json
        -   name: Upload devices artifact
            uses: actions/upload-artifact@v7
            with:
                name: devices.json
                path: ./out/devices.json
        -   name: Upload documentation artifact
            uses: actions/upload-artifact@v7
            with:
                name: Documentation.pdf
                path: ./out/Documentation.pdf
        -   name: Upload devices md artifact
            uses: actions/upload-artifact@v7
            with:
                name: devices.md
                path: ./out/devices.md
        -   name: Upload devices bt md artifact
            uses: actions/upload-artifact@v7
            with:
                name: devices-bt.md
                path: ./out/devices-bt.md
        -   name: Upload devices modbus md artifact
            uses: actions/upload-artifact@v7
            with:
                name: devices-modbus.md
                path: ./out/devices-modbus.md
        -   name: Upload index.html artifact
            uses: actions/upload-artifact@v7
            with:
                name: index.html
                path: ./static/index.html
        -   name: Release
            uses: softprops/action-gh-release@v3
            if: github.ref_type == 'tag'
            with:
                files: |
                    ./out/protocols.json
                    ./out/enums.json
                    ./out/translations.json
                    ./out/devices.json
                    ./out/Documentation.pdf
                    ./out/devices.md
                    ./out/devices-bt.md
                    ./out/devices-modbus.md

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        if: ${{ github.ref_type == 'tag' }}
        steps:
        -   name: Checkout
            uses: actions/checkout@v4
        -   name: Setup Pages
            uses: actions/configure-pages@v5
        -   name: Download all workflow run artifacts
            uses: actions/download-artifact@v5
            with:
                merge-multiple: true
                path: './out'
        -   name: Upload artifact
            uses: actions/upload-pages-artifact@v3
            with:
                path: './out'
        -   name: Deploy to GitHub Pages
            id: deployment
            uses: actions/deploy-pages@v5
